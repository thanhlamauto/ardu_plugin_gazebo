# EXPERIMENTAL SITL-ONLY profile.
# Gazebo counterpart of benchmark profile `tight_passage`.
# Offline: high completion rate, but margin=2 m was violated in some seeds.
# Do not use on hardware and do not describe as a safe configuration.

hz: 10.0
dt: 0.1
tau: 0.5
horizon: 40
samples: 500
lambda: 3.0
device: cpu
seed: 7

vmax: 1.2
vzmax: 1.0
yaw_rate_max: 0.6
noise_xy: 0.9
noise_z: 0.3
noise_yaw: 0.3

margin: 2.0
w_goal: 2.0
w_terminal: 10.0
w_obstacle: 12.0
w_u: 0.05
w_du: 0.2
w_yaw: 0.2
w_path: 0.0
path_scale_m: 1.0

command_alpha: 0.45
max_accel_xy: 0.7
max_accel_z: 0.8
max_yaw_accel: 1.2
goal_slowdown_radius: 3.0
goal_approach_gain: 0.45
goal_min_speed: 0.10

goal_radius: 0.25
wp_radius: 1.25
state_source: odom
lidar_topic: /sensor_suite/lidar/points
odom_topic: /iris/odometry
max_points: 200
max_raw_points: 25000
sensor_offset_body_frd: [0.08, 0.0, -0.16]

# Benchmark used no brake because it had no vehicle to protect.  The Gazebo
# replay intentionally retains a 0.5 m last-resort gate, so it is not bitwise
# identical to the offline simulation.
hard_brake_m: 0.5
stale_after_s: 1.0
planner_timeout_ms: 90.0

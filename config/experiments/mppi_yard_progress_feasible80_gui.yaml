# Gazebo GUI demo variant of mppi_yard_progress_feasible80.yaml.
# Objective, proposals, dynamics and safety predicate are identical. Only the
# planner wall-clock deadline is widened for rendering overhead on this Mac.
# This is a demo/runtime accommodation, not a change to simulated dynamics.
cost_profile: paper
hz: 10.0
dt: 0.1
tau: 0.5
horizon: 30
samples: 80
lambda: 1.0
vmax: 10.0
vzmax: 0.6
reference_speed_m_s: 10.0
reference_accel_m_s2: 0.0
reference_lateral_accel_m_s2: 1.0
reference_corner_radius_m: 1.5
reference_corner_samples: 12
w_path: 400.0
path_scale_m: 1.0
w_reference_velocity: 0.0
w_terminal: 0.0
w_collision: 1000000.0
collision_radius_m: 1.5
w_goal: 0.0
w_obstacle: 0.0
w_u: 0.0
w_du: 0.0
w_yaw: 0.0
paper_r_u: [0.01, 0.05, 0.05, 0.10]
paper_r_delta_u: [400.0, 400.0, 50.0, 20.0]
command_alpha: 0.30
max_accel_xy: 3.0
max_accel_z: 0.4
max_yaw_accel: 0.6
goal_slowdown_radius: 0.0
goal_radius: 0.35
wp_radius: 1.25
hard_brake_m: 1.5
hard_brake_release_m: 2.0
hard_brake_delay_s: 0.25
recovery_speed_m_s: 0.25
stale_after_s: 1.0

# GUI run 2026-09-16: mean 84--87 ms, p95 118--122 ms.  The headless 90 ms
# deadline caused 53/265 and 83/268 zero-command holds.  150 ms covers all but
# 4/265 and 6/268 observed cycles while leaving stale-state checks unchanged.
planner_timeout_ms: 150.0

reference_warm_start: true
brake_swept_path: true
validate_final_trajectory: true

known_obstacle_sdf: worlds/iris_mppi_yard_runup60.sdf
response_accel_model: true
response_accel_xy: 3.0
response_jerk_xy: 4.0
proactive_proposals: true
collision_cost_buffer_m: 0.55
w_stopping: 1000000.0
stopping_margin_m: 2.5
stopping_delay_s: 0.25

path_progress_objective: true
w_progress: 5000.0
w_speed_limit: 10000.0

validate_stopping_trajectory: true
stopping_guard_uncertainty_m: 0.0
feasible_sample_weighting: true

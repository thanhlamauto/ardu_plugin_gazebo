# Demo profile for the three fixed Gazebo routes in
# docs/RUN_3_MPPI_MAPS_QUICKSTART_VI.md.
#
# This keeps the paper-derived cost categories used by
# mppi_paper_cost_only.yaml, but the timing, velocity-level control mapping,
# command conditioner and arrival gates are PROJECT ENGINEERING CHOICES.
# It is intentionally separate so the source-audit profile is not silently
# changed merely to improve a demonstration.
cost_profile: paper

hz: 10.0
dt: 0.1
tau: 0.5
horizon: 30
samples: 500
lambda: 100.0

# Slow, smooth video-demo envelope.  The lower reference speed leaves more
# tracking margin through turns; vmax remains a hard upper bound, not a target.
vmax: 1.0
vzmax: 0.6
reference_speed_m_s: 0.60
# Round interior global-path vertices before time-parameterization.  This does
# not replace collision checking and is enabled only for the video-demo profile.
reference_corner_radius_m: 0.8
reference_corner_samples: 6

# Time-indexed global-reference and collision terms.
w_path: 400.0
path_scale_m: 1.0
w_reference_velocity: 40.0
w_terminal: 0.0
w_collision: 1000000.0
collision_radius_m: 1.5

# Project-only objective terms remain disabled in the paper-cost profile.
w_goal: 0.0
w_obstacle: 0.0
w_u: 0.0
w_du: 0.0
w_yaw: 0.0

# Velocity-level adaptation of Minařík et al.'s effort/input-change terms.
paper_r_u: [0.01, 0.05, 0.05, 0.10]
# Project-tuned velocity/yaw-rate weights.  Equal vx/vy entries avoid an ENU
# axis bias.  The cost also includes u[0] - u_sent_previous.
paper_r_delta_u: [100.0, 100.0, 50.0, 20.0]

# Compared with the audit profile (alpha=0.45, accel=1.5), these limits trade
# traversal time for visibly smoother commands and easier ArduPilot tracking.
# Candidate values: Gazebo live validation is still required after this edit.
command_alpha: 0.30
max_accel_xy: 0.6
max_accel_z: 0.4
max_yaw_accel: 0.6

# Begin tapering only at the final waypoint.  A 0.35 m terminal gate avoids a
# noisy estimator hovering just outside the old 0.25 m strict inequality.
goal_slowdown_radius: 4.0
goal_approach_gain: 0.5
goal_min_speed: 0.10
goal_radius: 0.35
wp_radius: 1.25

# Last-resort live safety layer.  These values do not make a geometrically
# infeasible narrow slot safe; use only the documented clearance-checked route.
hard_brake_m: 1.0
hard_brake_release_m: 1.8
hard_brake_delay_s: 0.25
recovery_speed_m_s: 0.25
stale_after_s: 1.0
planner_timeout_ms: 90.0

# Experimental known-map + identified acceleration-memory surrogate, no retiming.
# Validation experiment, not a validated 10m/s navigation profile.
# SITL: fixed 10 m/s path-progress reference, no external speed retiming.
# MPPI optimizes tracking and obstacle avoidance; conditioning/brake stay active.
# Reference lateral acceleration budget is inactive without retiming.
# Not a forced 10 m/s MAVLink command or initial physical velocity.
cost_profile: paper
hz: 10.0
dt: 0.1
tau: 0.5
horizon: 30
samples: 350
lambda: 1.0
vmax: 10.0
vzmax: 0.6
reference_speed_m_s: 10.0
reference_accel_m_s2: 0.0
reference_lateral_accel_m_s2: 1.0
reference_corner_radius_m: 1.5
reference_corner_samples: 12
w_path: 400.0
path_scale_m: 1.0
w_reference_velocity: 40.0
w_terminal: 0.0
w_collision: 1000000.0
collision_radius_m: 1.5
w_goal: 0.0
w_obstacle: 0.0
w_u: 0.0
w_du: 0.0
w_yaw: 0.0
paper_r_u: [0.01, 0.05, 0.05, 0.10]
paper_r_delta_u: [400.0, 400.0, 50.0, 20.0]
command_alpha: 0.30
max_accel_xy: 3.0
max_accel_z: 0.4
max_yaw_accel: 0.6
goal_slowdown_radius: 0.0
goal_radius: 0.35
wp_radius: 1.25
hard_brake_m: 1.5
hard_brake_release_m: 2.0
hard_brake_delay_s: 0.25
recovery_speed_m_s: 0.25
stale_after_s: 1.0
planner_timeout_ms: 90.0

reference_warm_start: true
brake_swept_path: true

validate_final_trajectory: true

known_obstacle_sdf: worlds/iris_mppi_yard_runup60.sdf
response_accel_model: true
response_accel_xy: 3.0
response_jerk_xy: 4.0

# Experimental proactive braking/turning samples, reference remains unchanged.
proactive_proposals: true

# Conservative cost margin to discourage trajectories at the swept gate boundary.
collision_cost_buffer_m: 0.55

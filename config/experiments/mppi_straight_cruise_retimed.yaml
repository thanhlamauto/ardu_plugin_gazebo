# Experimental 300m cruise: lower MPPI temperature, reference proposals,
# acceleration/curvature/end braking retiming, and 3D stopping-segment brake.
# All physical command limits match the original retimed profile. SITL only.
cost_profile: paper
hz: 10.0
dt: 0.1
tau: 0.5
horizon: 30
samples: 350
lambda: 1.0
vmax: 10.0
vzmax: 0.6
reference_speed_m_s: 5.0
reference_accel_m_s2: 0.6
reference_lateral_accel_m_s2: 0.6
reference_corner_radius_m: 0.8
reference_corner_samples: 6
w_path: 400.0
path_scale_m: 1.0
w_reference_velocity: 40.0
w_terminal: 0.0
w_collision: 1000000.0
collision_radius_m: 1.5
w_goal: 0.0
w_obstacle: 0.0
w_u: 0.0
w_du: 0.0
w_yaw: 0.0
paper_r_u: [0.01, 0.05, 0.05, 0.10]
paper_r_delta_u: [100.0, 100.0, 50.0, 20.0]
command_alpha: 0.30
max_accel_xy: 0.6
max_accel_z: 0.4
max_yaw_accel: 0.6
goal_slowdown_radius: 0.0

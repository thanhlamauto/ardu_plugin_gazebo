name: docker-humble-runtime

on: workflow_dispatch

jobs:
  arm64-build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build ROS 2 Humble ARM64 image
        run: >-
          docker build --platform linux/arm64 --build-arg OPENCV_BUILD_JOBS=4
          -f docker/Dockerfile.humble -t uav-monocular:humble .
      - name: Check C++ executables
        run: docker run --rm uav-monocular:humble ros2 pkg executables uav_navigation_ros
      - name: Parse runtime launch
        run: >-
          docker run --rm uav-monocular:humble
          ros2 launch uav_navigation_ros monocular_runtime.launch.xml --show-args
      - name: Check image architecture
        run: test "$(docker image inspect uav-monocular:humble --format '{{.Os}}/{{.Architecture}}')" = linux/arm64
      - name: Check read-only model mount
        run: >-
          docker run --rm --runtime runc --read-only
          --tmpfs /tmp:rw,nosuid,nodev --tmpfs /root/.ros:rw,nosuid,nodev
          --cap-drop ALL --security-opt no-new-privileges
          --mount type=bind,src=/etc/hostname,dst=/models/depth.onnx,readonly
          uav-monocular:humble bash -lc 'test -r /models/depth.onnx && ros2 pkg executables uav_navigation_ros'
      - name: Export ARM64 image
        run: |
          docker save uav-monocular:humble | gzip -1 > uav-monocular-humble-arm64.tar.gz
          sha256sum uav-monocular-humble-arm64.tar.gz
      - name: Upload ARM64 image
        uses: actions/upload-artifact@v4
        with:
          name: uav-monocular-humble-arm64
          path: uav-monocular-humble-arm64.tar.gz
          retention-days: 7
          compression-level: 0
